# The documentation (docs/), built with zola and published to GitHub Pages.
# The site is drawn by vpkit-zola, which
# docs/themes/vpkit-zola links to as a checkout beside this one
# (../vpkit-zola), so vpkit-zola is checked out beside it here too, at its
# main, unpinned, as a local checkout would be. Its stylesheet ships
# prebuilt and the examples' is committed (docs/static/), so the build is
# zola alone.
name: docs

on:
  # Nightly (Asia/Taipei 03:xx; cron is UTC) plus manual. No push/PR
  # trigger: agents push many times a day and a run per push was not
  # worth it. The gate job skips a nightly whose HEAD already has a
  # finished run.
  schedule:
    - cron: "10 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Nightly only: skip everything when this workflow already finished a
  # run (not cancelled) on this exact commit. Manual runs always go.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          wf=${GITHUB_WORKFLOW_REF%@*}; wf=${wf##*/}
          last=$(gh run list -w "$wf" -b main -s completed -L 20 --json headSha,conclusion \
            -q '[.[] | select(.conclusion != "cancelled")][0].headSha')
          echo "last finished run: ${last:-none}; HEAD: $GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$last" != "$GITHUB_SHA" ]; then echo run=true; else echo run=false; fi >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: vpkit
      - uses: actions/checkout@v7
        with:
          repository: at-least/vpkit-zola
          path: vpkit-zola
      - name: Install zola
        run: |
          curl -sSfL https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: zola --root vpkit/docs build --base-url "${{ steps.pages.outputs.base_url }}" --output-dir "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
