<header class="vp-topbar">
  <div class="vp-topbar-row">
    <a class="vp-topbar-title" href="#"><span>Store</span></a>
    <button class="vp-hamburger" type="button" aria-label="Menu" aria-controls="screen" aria-expanded="false" onclick="var s=document.getElementById('screen');s.hidden=!s.hidden;this.setAttribute('aria-expanded',String(!s.hidden))"><span class="vp-hamburger-box"><span></span><span></span><span></span></span></button>
  </div>
  <div class="vp-screen" id="screen" hidden>
    <div class="vp-screen-container">
      <nav aria-label="Main">
        <a class="vp-nav-link" data-variant="screen" href="#" aria-current="page">Store</a>
        <a class="vp-nav-link" data-variant="screen" href="#">Orders</a>
        <details class="vp-accordion">
          <summary class="vp-accordion-title">Help<svg class="vp-accordion-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></summary>
          <a class="block pl-3 text-sm leading-7" href="#">Shipping</a>
          <a class="block pl-3 text-sm leading-7" href="#">Returns</a>
        </details>
      </nav>
      <div class="vp-screen-row mt-6">
        <p class="vp-screen-label">Appearance</p>
        <button class="vp-toggle" data-variant="appearance" type="button" role="switch" aria-checked="false" aria-label="Appearance">
          <span class="vp-toggle-check"><span class="vp-toggle-icon">
            <svg class="vp-toggle-light" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="vp-toggle-dark" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9a9 9 0 1 1-9-9"/></svg>
          </span></span>
        </button>
      </div>
    </div>
  </div>
</header>
