<button class="vp-btn" type="button" onclick="const d = document.getElementById('rename'); d.close(); d.showModal()">Rename…</button>
<dialog class="vp-dialog" id="rename" aria-labelledby="rename-title" open>
  <form method="dialog">
    <h2 class="vp-dialog-title" id="rename-title">Rename</h2>
    <p>A new name for notes.txt.</p>
    <div class="vp-dialog-actions">
      <button class="vp-btn" value="cancel">Cancel</button>
      <button class="vp-btn" data-variant="brand" value="rename">Rename</button>
    </div>
  </form>
</dialog>
