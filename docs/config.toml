# vpkit's documentation, a site built with vpkit-zola, the Zola theme on
# vpkit's layout (README.md). zola serve here; base_url is where GitHub
# Pages publishes it (.github/workflows/docs.yml builds it with the one
# Pages reports).
base_url = "https://at-least.github.io/vpkit"
title = "vpkit"
description = "VitePress's look as a Tailwind CSS v4 theme: its variables, utilities, components and color themes."
theme = "vpkit-zola"
compile_sass = false
build_search_index = false

[markdown]
github_alerts = true
bottom_footnotes = true
insert_anchor_links = "right"
external_links_target_blank = true
external_links_no_referrer = true

[markdown.highlighting]
style = "inline"
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
logo = "/logo.svg"
# the favicon; the site's color theme, vitepress, a stylesheet like any
# (there with JavaScript off, fetched beside the page's own); and the
# script that swaps it for the theme the gallery stored for this session
# (static/theme-pick.js), which must be in the head to be there at the
# first paint. Pages caches it for ten minutes (no cachebust here, unlike
# the scripts the templates link): bump ?v= with any change to what it
# stores or reads, or a cached old script meets the new pages
head = [
  { tag = "link", attrs = { rel = "icon", type = "image/svg+xml", href = "/logo.svg" } },
  { tag = "link", attrs = { rel = "stylesheet", href = "/themes/vitepress.css", data-theme = "vitepress" } },
  { tag = "script", attrs = { src = "/theme-pick.js?v=2" } },
]
social_links = [{ icon = "github", link = "https://github.com/at-least/vpkit" }]
edit_link = { pattern = "https://github.com/at-least/vpkit/edit/main/docs/content/:path", text = "Edit this page on GitHub" }
footer = { message = "Released under the MIT License.", copyright = "Copyright © 2026-present newlix" }
outline = [2, 3]
search = true

# one sidebar for the whole site: the guide's group, then every component
# in one list, alphabetical, its heading the overview, as shadcn/ui's docs
# list theirs; on every page but the home and the 404. VitePress's own
# docs give the guide and the reference one each, with the guide's ending
# in a link to the reference
[[extra.sidebar]]
text = "Introduction"
items = [
  { text = "What is vpkit?", link = "@/guide/what-is-vpkit.md" },
  { text = "Getting Started", link = "@/guide/getting-started.md" },
  { text = "Utilities and Variables", link = "@/guide/utilities.md" },
  { text = "Rust", link = "@/guide/rust.md" },
  { text = "Themes", link = "@/themes.md" },
]

